<style>
:root{--bg:#f6f4ef;--ink:#1f2933;--muted:#6b7280;--card:#fff;--accent:#2f6fde;--good:#1f9d55;--learn:#d97706;--hl:#fff3a3;--line:#e5e1d8}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent;min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:14px 14px calc(24px + env(safe-area-inset-bottom))}
h1{font-size:1.25rem;margin:4px 0 10px;text-align:center;letter-spacing:-.01em}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:8px 14px;font:600 .9rem Inter,system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip .n{opacity:.6;font-weight:400;margin-left:4px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 10px;flex-wrap:wrap}
.counter{font-weight:700;font-size:1rem;min-width:70px}
.stats{color:var(--muted);font-size:.85rem}
.tbtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font:600 .85rem Inter,system-ui,sans-serif;cursor:pointer;color:var(--ink)}
.tbtn.on{background:var(--learn);border-color:var(--learn);color:#fff}
.scene{perspective:1400px;width:100%;height:min(50vh,440px);min-height:280px;margin:0 auto;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.card{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d;cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border-radius:18px;box-shadow:0 6px 24px rgba(0,0,0,.08),0 1px 3px rgba(0,0,0,.06);padding:44px 22px 36px;display:flex;flex-direction:column;justify-content:center;overflow-y:auto;border:1px solid var(--line)}
.back{transform:rotateY(180deg);background:#fffdf6}
.tag{position:absolute;top:12px;left:16px;font:600 .72rem Inter,system-ui,sans-serif;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.status{position:absolute;top:10px;right:14px;font:700 .72rem Inter,system-ui,sans-serif;padding:3px 8px;border-radius:999px}
.status.got{background:#dcf5e6;color:var(--good)}.status.learning{background:#fdecd3;color:var(--learn)}
.hint{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:.75rem;color:var(--muted)}
.text{font-family:"Patrick Hand","Comic Sans MS",cursive;font-size:1.6rem;line-height:1.3;text-align:center;word-wrap:break-word}
.back .text{font-size:1.4rem;text-align:left}
.back .text div{margin:0 0 6px}
mark{background:var(--hl);color:inherit;padding:0 3px;border-radius:4px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btn{border:none;border-radius:12px;padding:14px 10px;font:700 1rem Inter,system-ui,sans-serif;cursor:pointer;background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08);border:1px solid var(--line)}
.btn:active{transform:scale(.98)}
.btn.good{background:var(--good);color:#fff;border-color:var(--good)}
.btn.learn{background:var(--learn);color:#fff;border-color:var(--learn)}
.btn:disabled{opacity:.4;cursor:default}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px}
.empty{text-align:center;padding:60px 20px;color:var(--muted);font-size:1.05rem}
.foot{text-align:center;color:var(--muted);font-size:.78rem;margin-top:16px}
.foot button{background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.78rem}
.keys{display:none}
@media (hover:hover) and (pointer:fine){.keys{display:inline}}
@media (min-width:600px){.text{font-size:1.9rem}.back .text{font-size:1.55rem}h1{font-size:1.5rem}}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:#ebe7de;border-radius:12px;padding:4px;margin:0 0 10px}
.mode{border:none;background:transparent;border-radius:9px;padding:10px 2px;font:700 .85rem Inter,system-ui,sans-serif;color:var(--muted);cursor:pointer}
.mode.active{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.qbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 0 10px;font-weight:700;flex-wrap:wrap}
.qbar .sub{color:var(--muted);font-weight:600;font-size:.9rem}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 6px 24px rgba(0,0,0,.08);padding:34px 18px 18px;position:relative}
.qtext{font-family:"Patrick Hand","Comic Sans MS",cursive;font-size:1.45rem;line-height:1.3;text-align:center;overflow-wrap:anywhere}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;font:400 1rem/1.4 Inter,system-ui,sans-serif;color:var(--ink);cursor:pointer;overflow-wrap:anywhere}
.opt .letter{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:#ebe7de;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem}
.opt .otext div{margin:0 0 2px}
.opt:disabled{cursor:default;color:var(--ink)}
.opt.right{border-color:var(--good);background:#e3f6ea}
.opt.right .letter{background:var(--good);color:#fff}
.opt.wrong{border-color:#d64545;background:#fde8e8}
.opt.wrong .letter{background:#d64545;color:#fff}
.opt.dim{opacity:.55}
.fb{margin:12px 0 0;padding:12px 14px;border-radius:12px;font-weight:600}
.fb.ok{background:#e3f6ea;color:#14663a}.fb.no{background:#fde8e8;color:#9b1c1c}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);width:100%;margin-top:12px}
.btn.learn.primary{background:var(--learn);border-color:var(--learn)}
.summary{text-align:center}
.summary .big{font-size:2.4rem;font-weight:700;margin:6px 0}
.missed{text-align:left;margin:14px 0 0;padding:0;list-style:none}
.missed li{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 8px;font-size:.92rem}
.missed b{display:block;margin-bottom:4px}
.mgrid{display:grid;grid-template-columns:2fr 3fr;gap:8px;align-items:start}
.mcol{display:grid;gap:8px}
.mcol h2{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 2px}
.mi{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px;font:400 .88rem/1.35 Inter,system-ui,sans-serif;color:var(--ink);text-align:left;cursor:pointer;overflow-wrap:anywhere;width:100%;transition:background .15s,border-color .15s}
.mi.term{font-weight:600}
.mi div{margin:0 0 2px}
.mi.sel{border-color:var(--accent);background:#e8f0fd;box-shadow:0 0 0 2px rgba(47,111,222,.25)}
.mi.done{border-color:var(--good);background:#e3f6ea;color:#14663a;cursor:default}
.mi.bad{border-color:#d64545;background:#fde8e8;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.mhelp{color:var(--muted);font-size:.85rem;margin:0 0 10px}
.mdone{background:#e3f6ea;color:#14663a;border-radius:14px;padding:14px;text-align:center;font-weight:700;margin:0 0 12px}
@media (min-width:600px){.qtext{font-size:1.7rem}.mi{font-size:.95rem;padding:12px}.mgrid{gap:12px}}
@media (prefers-reduced-motion:reduce){.mi.bad{animation:none}}
@media (max-width:480px){.modes{grid-template-columns:repeat(2,1fr)}}
.ptq{margin:0 0 12px;padding:34px 14px 14px}
.ptq .opts{margin-top:10px}
.pq{font-weight:700;font-size:1.02rem;line-height:1.4;overflow-wrap:anywhere}
.opt.picked{border-color:var(--accent);background:#e8f0fd}
.opt.picked .letter{background:var(--accent);color:#fff}
.status.wrongtag{background:#fde8e8;color:#9b1c1c}
#ptResult{margin:0 0 12px}
body.test-mode .chips{display:none}

<script>
const CARDS = [{"id": 1, "topic": "Financial planning", "front": "What does a financial plan link together?", "back": "Assumptions -> revenue and headcount costs -> income statement, balance sheet, cash flow. Change one driver and the whole model should update."}, {"id": 2, "topic": "Financial planning", "front": "One-year plan: what level of detail, and what is in it?", "back": "Monthly detail: new contracts, annual and monthly recurring revenue, deferred revenue, department headcount, venture debt schedule, capitalization table, options pool, sensitivity."}, {"id": 3, "topic": "Financial planning", "front": "Five-year plan: what does it show?", "back": "Annual view: growth path, when you need the next raise, runway, and whether the story still holds. Read cash and hiring lead times, not just revenue."}, {"id": 4, "topic": "Financial planning", "front": "Reviewing a plan: what is often missing?", "back": "Churn, platform costs before revenue, next-year hires, sales support, options and bonuses. Software metrics can mislead: still check cash burn and runway."}, {"id": 5, "topic": "Financial planning", "front": "Excess capacity", "back": "Unused people, seats, or production you already pay for. Revenue can grow without a matching cost jump, until capacity runs out, then costs step up. Red flag: infinite free capacity."}, {"id": 6, "topic": "Financial planning", "front": "Compensation table: what does it show?", "back": "Who gets cash salary vs. equity; option pool size; founders' common shares vs. investors' preferred; granted vs. available options. Ties to dilution."}, {"id": 7, "topic": "Financial planning", "front": "Student-built one-year and five-year plan cases: be ready to...", "back": "Build or interpret the plan: change the variables and see what happens to cash and rates."}, {"id": 8, "topic": "Pre-money and post-money", "front": "Pre-money value", "back": "What the company is worth BEFORE the new cash comes in."}, {"id": 9, "topic": "Pre-money and post-money", "front": "Post-money value (formula)", "back": "Post-money = pre-money + new investment"}, {"id": 10, "topic": "Pre-money and post-money", "front": "Investor ownership % (formula)", "back": "Investor % = new investment / post-money (divide by POST-money, not pre-money)"}, {"id": 11, "topic": "Pre-money and post-money", "front": "Price per share (formula)", "back": "Price per share = pre-money / pre-money fully diluted shares"}, {"id": 12, "topic": "Pre-money and post-money", "front": "Founders' post-money ownership % (formula)", "back": "Founders % = 1 - investor % - option pool % (template option pool = 15%)"}, {"id": 13, "topic": "Pre-money and post-money", "front": "MATH: Pre-money $8 million, new investment $2 million, 4,000,000 fully diluted shares. Post-money? Investor %? Price per share?", "back": "Post = $8 million + $2 million = $10 million; Investor = $2 million / $10 million = 20%; Price = $8,000,000 / 4,000,000 = $2.00"}, {"id": 14, "topic": "Pre-money and post-money", "front": "MATH: Pre-money $10 million, new investment $15 million, 3,000,000 fully diluted shares. Post-money? Investor %? Price per share?", "back": "Post = $10 million + $15 million = $25 million; Investor = $15 million / $25 million = 60%; Price = $10,000,000 / 3,000,000 = $3.33"}, {"id": 15, "topic": "Pre-money and post-money", "front": "MATH: In the $10 million pre-money / $15 million deal, the investor owns 60% and the option pool is 15%. What % do founders own?", "back": "Founders = 1 - 60% - 15% = 25%"}, {"id": 16, "topic": "Pre-money and post-money", "front": "MATH: Pre-money $6 million, new investment $4 million, 15% option pool. Post-money? Investor %? Founders %?", "back": "Post = $6 million + $4 million = $10 million; Investor = $4 million / $10 million = 40%; Founders = 1 - 40% - 15% = 45%"}, {"id": 17, "topic": "Pre-money and post-money", "front": "MATH: An investor puts in $3 million for 25% of the company. Post-money? Pre-money?", "back": "Post = $3 million / 25% = $12 million; Pre = $12 million - $3 million = $9 million"}, {"id": 18, "topic": "Pre-money and post-money", "front": "MATH: Pre-money $12 million, 6,000,000 fully diluted shares, new investment $3 million. Price per share? New shares issued?", "back": "Price = $12,000,000 / 6,000,000 = $2.00; New shares = $3,000,000 / $2.00 = 1,500,000; Check: 1.5 million / 7.5 million shares = 20% = $3 million / $15 million post"}, {"id": 19, "topic": "Funding sources", "front": "Friends and family: size, pros, cons", "back": "Small sums; early or first money. Pros: fast, flexible. Cons: relationship risk; often no expert help."}, {"id": 20, "topic": "Funding sources", "front": "Angel investing: typical check size", "back": "$100 thousand to $4 million+ (Session 15 slide 5)"}, {"id": 21, "topic": "Funding sources", "front": "Accredited investor (needed by most angels)", "back": "Net worth of at least $1 million, OR at least $200,000 annual individual income, OR at least $300,000 annual joint income."}, {"id": 22, "topic": "Funding sources", "front": "Angel groups and angel platforms: examples", "back": "Groups: Band of Angels, Sand Hill Angels, Keiretsu Forum. Platforms (websites): AngelList, Crunchbase, Gust, Wefunder."}, {"id": 23, "topic": "Funding sources", "front": "Crowdfunding: typical size and the 3 types", "back": "$10 thousand to low millions; Types: product (rewards / pre-sales), equity, and token / cryptocurrency (coin offerings)."}, {"id": 24, "topic": "Funding sources", "front": "Product crowdfunding: how it works and pros", "back": "Kickstarter / Indiegogo; rewards or pre-sales; usually a 30-day raise with a minimum target. Pros: lots of cash fast; non-dilutive (no equity given)."}, {"id": 25, "topic": "Funding sources", "front": "Product crowdfunding: cons", "back": "Miss the target -> return the funds; funds may be taxable revenue with no offsetting costs; product never finished; product not protected before launch."}, {"id": 26, "topic": "Funding sources", "front": "Equity crowdfunding: pros and cons", "back": "Pros: raise cash quickly, set the terms, rarely give board seats. Cons: dilutive; many small investors who add little beyond cash; you can't pick the investors."}, {"id": 27, "topic": "Funding sources", "front": "Token / cryptocurrency crowdfunding (initial coin offerings)", "back": "Rare and prone to fraud; long-term viability still being determined; regulators slow to act."}, {"id": 28, "topic": "Funding sources", "front": "Venture capital: size and what you give up", "back": "$100 thousand to $100 million+; Equity for growth; investors get board seats and control terms."}, {"id": 29, "topic": "Funding sources", "front": "Types of venture capital firms", "back": "Incubators (Y Combinator); early stage (Sequoia, Andreessen Horowitz); late stage; corporate; geographic- or sector-focused."}, {"id": 30, "topic": "Funding sources", "front": "Venture capital fund life", "back": "Years 1-4: invest, full management fees. Years 5-10: no new deals, follow-ons from reserves (\"dry powder\"). Years 10+: harvest, no management fees."}, {"id": 31, "topic": "Funding sources", "front": "Debt / venture debt: size and when it comes", "back": "$100 thousand to $50 million+; always follows venture equity: about 20%-40% of the equity raise, or based on recurring revenue. Not bank debt: normally more expensive (fees + interest + warrants)."}, {"id": 32, "topic": "Funding sources", "front": "Special purpose acquisition company (\"blank-check\" company)", "back": "No operations; raises cash in an initial public offering to buy or merge with a company. Cash sits in trust; 2 years to do a deal or return the funds."}, {"id": 33, "topic": "Funding sources", "front": "Special purpose acquisition company: pros and cons", "back": "Pros: faster / cheaper than a classic initial public offering; experienced management team. Cons: deadline pressure (target asks a premium); less oversight for retail investors."}, {"id": 34, "topic": "Funding sources", "front": "Private equity: what it does", "back": "Today's leveraged buyout funds: load the target with debt. Growth capital, roll-ups, undervalued firms, take-privates. Sell in about 5-7 years."}, {"id": 35, "topic": "Funding sources", "front": "Private equity: local firm examples", "back": "Serent Capital, Hellman & Friedman, Gryphon Investors, San Francisco Equity Partners, Mainsail Partners."}, {"id": 36, "topic": "Venture debt terms", "front": "How do you find the effective rate on venture debt?", "back": "List monthly cash flows from the LENDER's view (fees, interest, principal, warrant gain), then take the internal rate of return across the dates."}, {"id": 37, "topic": "Venture debt terms", "front": "Interest-only months vs. amortizing months", "back": "Interest-only payment = commitment x annual rate / 12; Amortizing = a fixed payment that pays off the principal over the amortization window."}, {"id": 38, "topic": "Venture debt terms", "front": "Warrant gain (economic warrants): formula and timing", "back": "coverage % x commitment x (return multiple - 1); Added at the end (typically month 60)."}, {"id": 39, "topic": "Venture debt terms", "front": "What raises the effective rate?", "back": "Higher fees -> higher. Bigger warrant gain -> much higher. Longer interest-only -> cash later, rate often up. Higher coupon -> higher, but warrants usually dominate."}, {"id": 40, "topic": "Venture debt terms", "front": "Homework check: what do warrants do to the effective rate?", "back": "With warrants: 15.85% / 16.16% / 14.54%; No warrants: 10.06% / 9.84% / 11.22%; Warrant gain is a big part of the lender's true return."}, {"id": 41, "topic": "Venture debt terms", "front": "Venture debt: common negotiated terms", "back": "Interest rate; fees; warrants (common vs. preferred; strike = last vs. next round); interest-only period; draw period; amortization; prepayment penalty (3-2-1 or fixed fee)."}, {"id": 42, "topic": "Venture debt terms", "front": "Venture debt: control terms", "back": "Affirmative covenants (must do: reporting, taxes, insurance); Negative covenants (can't do: mergers, more debt, distributions); Material adverse change clause"}, {"id": 43, "topic": "Venture Deals chapters", "front": "Venture Deals, Chapter 3: How to Raise Money", "back": "How much to raise; materials; find a lead; how venture firms decide; use competition; close."}, {"id": 44, "topic": "Venture Deals chapters", "front": "Venture Deals, Chapter 8: Convertible Debt", "back": "Discount, valuation cap, interest, conversion, warrants; early vs. late stage; dangers; alternatives (e.g. simple agreement for future equity)."}, {"id": 45, "topic": "Venture Deals chapters", "front": "Venture Deals, Chapter 10: Crowdfunding", "back": "Product vs. equity vs. token crowdfunding (matches Session 15)."}, {"id": 46, "topic": "Venture Deals chapters", "front": "Venture Deals, Chapter 11: Venture Debt", "back": "Role of debt vs. equity; economic, amortization, and control terms; negotiation; restructuring."}, {"id": 47, "topic": "Venture Deals chapters", "front": "Venture Deals, Chapter 12: How Venture Capital Funds Work", "back": "Fund structure, fees, how partners make money, reserves, time pressure, corporate venture."}, {"id": 48, "topic": "Venture Deals chapters", "front": "Venture Deals, Chapter 14: Raising Money the Right Way", "back": "Don't ask for a nondisclosure agreement up front; don't go solo; don't oversell patents; communicate; be human."}, {"id": 49, "topic": "Guest speaker", "front": "Guest speaker: Sabrina Maisel - who is she?", "back": "NuFund Venture Group angel investor and deal leader (San Diego); Stemson Therapeutics director; PhD (doctorate) scientist. Bets on the product rather than the founder."}];

  const box = $("modeTest"), answered = Object.keys(pt.picks).length;
  let score = 0; PT.forEach((q,i) => { if (pt.picks[i] === q[2]) score++; });
  box.innerHTML =
    '<div class="qbar"><span>Practice test &middot; 20 questions</span><span class="sub" id="ptProgress">' + (pt.graded ? 'Score: ' + score + ' / 20' : answered + ' of 20 answered') + '</span></div>' +
    (pt.graded ? '<div class="qcard summary" id="ptResult"><div>Your score</div><div class="big">' + score + ' / 20</div><div>' + Math.round(score * 5) + '% correct</div>' +
      '<button class="btn primary" id="ptRetakeTop">Retake</button></div>' : '<p class="mhelp">Pick one answer for each question, then tap \u201cCheck my answers\u201d at the bottom.</p>') +
    PT.map((q,i) => {
      const pick = pt.picks[i], right = pick === q[2];
      return '<div class="qcard ptq" data-q="' + i + '"><span class="tag">Question ' + (i + 1) + '</span>' +
        (pt.graded ? '<span class="status ' + (right ? 'got">&#x2713; Right' : 'wrongtag">&#x2717; ' + (pick == null ? 'Not answered' : 'Wrong')) + '</span>' : '') +
        '<div class="pq">' + esc(q[0]) + '</div><div class="opts">' + q[1].map((o,k) => {
          let cls = "opt";
          if (pt.graded){ cls += k === q[2] ? " right" : k === pick ? " wrong" : " dim"; }
          else if (k === pick) cls += " picked";
          return '<button class="' + cls + '" data-k="' + k + '"' + (pt.graded ? " disabled" : "") + '><span class="letter">' + "ABCD"[k] + '</span><span class="otext">' + esc(o) + '</span></button>';
        }).join("") + '</div>' +
        (pt.graded && q[3] ? '<div class="fb ' + (right ? 'ok' : 'no') + '">' + esc(q[3]) + '</div>' : '') + '</div>';
    }).join("") +
    (pt.graded ? '<button class="btn primary" id="ptRetake">Retake</button>'
      : '<button class="btn primary" id="ptCheck">Check my answers' + (answered < 20 ? ' (' + (20 - answered) + ' unanswered)' : '') + '</button>');
  box.querySelectorAll(".ptq .opt").forEach(b => b.onclick = () => {
    const q = +b.closest(".ptq").dataset.q; pt.picks[q] = +b.dataset.k;
    b.parentNode.querySelectorAll(".opt").forEach(x => x.classList.toggle("picked", x === b));
    const n = Object.keys(pt.picks).length;
    $("ptProgress").textContent = n + " of 20 answered";
    $("ptCheck").textContent = "Check my answers" + (n < 20 ? " (" + (20 - n) + " unanswered)" : "");
  });
  if (pt.graded){ [$("ptRetake"), $("ptRetakeTop")].forEach(b => b.onclick = () => { pt = {picks: {}, graded: false}; ptRender(); window.scrollTo({top: 0}); }); }
  else $("ptCheck").onclick = () => { pt.graded = true; ptRender(); window.scrollTo({top: 0}); };
}
ptRender();
if (location.hash === "#multiple-choice") setMode("mc"); else if (location.hash === "#match") setMode("match"); else if (location.hash === "#practice-test") setMode("test");
</script>
</body>
</html>
